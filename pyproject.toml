[project]
name = "lightup"
version = "0.1.0"
description = "A desktop Akari game and AI search visualizer for DFS and A*"
readme = "README.md"
authors = [{ name = "Light Up Project" }]
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.8",
    "pygame-gui>=0.6.14",
]

[project.scripts]
lightup = "lightup:main"
lightup-benchmark = "lightup.benchmark.__main__:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
